<!--
  Wireframe: onizleme (V2)
  Task: C-007
  Karar Versiyonu: -
  Son Guncelleme: 2026-02-26

  Onizleme - Cihaz/Dil toggle ile sayfa onizlemesi
  - Desktop / Tablet / Mobil toggle
  - 4 dil secimi (TR/EN/DE/RU)
  - iframe benzeri onizleme alani
-->
<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onizleme - Legends DXP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .fonts-loading { opacity: 0; }
    .fonts-loaded { opacity: 1; transition: opacity 0.1s ease-in; }
  </style>
  <script>
    document.documentElement.classList.add('fonts-loading');
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      window.addEventListener('load', () => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    }
  </script>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="stylesheet" href="../../wireframe/css/wireframe.css">
  <script src="../../wireframe/js/icons.js"></script>
  <script src="../../wireframe/js/layout-components-v2.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'teal';
    document.documentElement.classList.add('theme-' + theme);
  </script>
</head>
<body class="min-h-screen wireframe-page" x-data="{
  sidebarOpen: true,
  mobileMenu: false,
  device: 'desktop',
  previewLang: 'tr'
}">

  <div class="flex min-h-screen">
    <div data-component="sidebar"></div>
    <div class="flex-1 flex flex-col min-w-0">
      <div data-component="header"></div>

      <!-- Preview Toolbar -->
      <div class="border-b-2 border-gray-300 bg-white px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="sayfa-builder.html" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </a>
          <div>
            <span class="text-sm font-semibold text-gray-900">Ana Sayfa</span>
            <span class="wf-v2-badge wf-v2-badge-gray ml-2">Taslak</span>
          </div>
        </div>

        <!-- Device Toggle -->
        <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1">
          <button @click="device = 'desktop'"
                  :class="device === 'desktop' ? 'bg-white shadow text-gray-900' : 'text-gray-500'"
                  class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Desktop
          </button>
          <button @click="device = 'tablet'"
                  :class="device === 'tablet' ? 'bg-white shadow text-gray-900' : 'text-gray-500'"
                  class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Tablet
          </button>
          <button @click="device = 'mobile'"
                  :class="device === 'mobile' ? 'bg-white shadow text-gray-900' : 'text-gray-500'"
                  class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Mobil
          </button>
        </div>

        <!-- Language Toggle -->
        <div class="flex items-center gap-1">
          <template x-for="lang in ['tr', 'en', 'de', 'ru']" :key="lang">
            <button @click="previewLang = lang"
                    :class="previewLang === lang ? 'wf-v2-btn wf-v2-btn-primary' : 'wf-v2-btn'"
                    class="text-xs uppercase w-10"
                    x-text="lang">
            </button>
          </template>
        </div>
      </div>

      <!-- Preview Area -->
      <main class="flex-1 bg-gray-100 flex items-start justify-center p-8 overflow-auto">

        <!-- Preview Frame -->
        <div :style="{
          width: device === 'desktop' ? '100%' : device === 'tablet' ? '768px' : '375px',
          maxWidth: device === 'desktop' ? '100%' : 'none'
        }" class="bg-white border-2 border-gray-300 rounded-lg shadow-lg transition-all duration-300 overflow-hidden">

          <!-- Simulated Browser Chrome -->
          <div class="bg-gray-100 border-b border-gray-200 px-4 py-2 flex items-center gap-2">
            <div class="flex gap-1.5">
              <div class="w-3 h-3 rounded-full bg-red-400"></div>
              <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
              <div class="w-3 h-3 rounded-full bg-green-400"></div>
            </div>
            <div class="flex-1 mx-4">
              <div class="bg-white rounded px-3 py-1 text-xs text-gray-500 border border-gray-200">
                thelandoflegends.com/<span x-text="previewLang"></span>
              </div>
            </div>
          </div>

          <!-- Simulated Page Content -->
          <div class="p-0">
            <!-- Hero -->
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 h-48 flex items-center justify-center relative" :class="device === 'mobile' ? 'h-32' : 'h-48'">
              <div class="text-center text-white">
                <h2 class="text-2xl font-bold" :class="device === 'mobile' ? 'text-lg' : 'text-2xl'" x-text="previewLang === 'tr' ? 'Efsaneler Diyarina Hos Geldiniz' : (previewLang === 'en' ? 'Welcome to The Land of Legends' : (previewLang === 'de' ? 'Willkommen im Land der Legenden' : 'Добро пожаловать в Страну Легенд'))"></h2>
                <p class="text-sm mt-2 opacity-80" x-text="previewLang === 'tr' ? 'Turkiyenin en buyuk tema parki' : (previewLang === 'en' ? 'Turkey\'s largest theme park' : (previewLang === 'de' ? 'Der größte Themenpark der Türkei' : 'Крупнейший тематический парк Турции'))"></p>
              </div>
            </div>

            <!-- Ticket Selector Placeholder -->
            <div class="bg-gray-50 border-b border-gray-200 p-4">
              <div class="max-w-lg mx-auto bg-white rounded-lg border border-gray-200 p-4 flex items-center gap-3">
                <div class="flex-1">
                  <div class="text-xs text-gray-400 mb-1" x-text="previewLang === 'tr' ? 'Tarih Secin' : 'Select Date'"></div>
                  <div class="h-8 bg-gray-100 rounded"></div>
                </div>
                <div class="flex-1">
                  <div class="text-xs text-gray-400 mb-1" x-text="previewLang === 'tr' ? 'Kisi Sayisi' : 'Guests'"></div>
                  <div class="h-8 bg-gray-100 rounded"></div>
                </div>
                <button class="bg-indigo-500 text-white px-4 py-2 rounded text-sm" x-text="previewLang === 'tr' ? 'Bilet Bul' : (previewLang === 'en' ? 'Find Tickets' : 'Suchen')"></button>
              </div>
            </div>

            <!-- Cards Placeholder -->
            <div class="p-6">
              <h3 class="text-lg font-bold text-gray-900 mb-4" x-text="previewLang === 'tr' ? 'Bugunku Etkinlikler' : (previewLang === 'en' ? 'Today at Legends' : 'Heute bei Legends')"></h3>
              <div class="grid gap-4" :class="device === 'mobile' ? 'grid-cols-1' : (device === 'tablet' ? 'grid-cols-2' : 'grid-cols-4')">
                <div class="bg-gray-100 rounded-lg h-32 border border-gray-200"></div>
                <div class="bg-gray-100 rounded-lg h-32 border border-gray-200"></div>
                <div class="bg-gray-100 rounded-lg h-32 border border-gray-200" :class="device === 'mobile' ? 'hidden' : ''"></div>
                <div class="bg-gray-100 rounded-lg h-32 border border-gray-200" :class="device !== 'desktop' ? 'hidden' : ''"></div>
              </div>
            </div>

            <!-- Footer Placeholder -->
            <div class="bg-gray-800 p-6">
              <div class="grid gap-4" :class="device === 'mobile' ? 'grid-cols-1' : 'grid-cols-4'">
                <div class="h-20"></div>
                <div class="h-20" :class="device === 'mobile' ? 'hidden' : ''"></div>
                <div class="h-20" :class="device === 'mobile' ? 'hidden' : ''"></div>
                <div class="h-20" :class="device === 'mobile' ? 'hidden' : ''"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../tool/js/tool-icons.js"></script>
  <script src="../../tool/js/toolbar.js"></script>
  <script src="../../tool/js/comments.js"></script>

</body>
</html>
