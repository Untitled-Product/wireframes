<!--
  Wireframe: etkinlik-zamanlama (V2)
  Task: C-005
  Karar Versiyonu: -
  Son Guncelleme: 2026-02-26

  Tekrarlama Kurali Editoru
  - Etkinlik secimi
  - Tekrar tipi (gunluk, haftalik, ozel)
  - Gun/saat secimi
  - Tarih araligi
-->
<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Zamanlama - Legends DXP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .fonts-loading { opacity: 0; }
    .fonts-loaded { opacity: 1; transition: opacity 0.1s ease-in; }
  </style>
  <script>
    document.documentElement.classList.add('fonts-loading');
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      window.addEventListener('load', () => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    }
  </script>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="stylesheet" href="../../wireframe/css/wireframe.css">
  <script src="../../wireframe/js/icons.js"></script>
  <script src="../../wireframe/js/layout-components-v2.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'teal';
    document.documentElement.classList.add('theme-' + theme);
  </script>
</head>
<body class="min-h-screen wireframe-page" x-data="{
  sidebarOpen: true,
  mobileMenu: false,
  repeatType: 'weekly',
  selectedDays: { mon: true, wed: true, fri: true, tue: false, thu: false, sat: false, sun: false }
}">

  <div class="flex min-h-screen">
    <div data-component="sidebar"></div>
    <div class="flex-1 flex flex-col min-w-0">
      <div data-component="header"></div>

      <main class="p-6 flex-1">
        <!-- Top Bar -->
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-3">
            <a href="etkinlik-takvimi.html" class="text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div>
              <h1 class="text-lg font-semibold text-gray-900">Zamanlama Duzenle</h1>
              <div class="text-xs text-gray-400">Masha &amp; Bear Live Show</div>
            </div>
          </div>
          <div class="flex gap-2">
            <button class="wf-v2-btn text-sm">Vazgec</button>
            <button class="wf-v2-btn wf-v2-btn-primary text-sm">Kaydet</button>
          </div>
        </div>

        <div class="max-w-2xl space-y-6">

          <!-- Etkinlik Bilgisi -->
          <div class="border-2 border-gray-300 rounded-lg p-5 bg-white">
            <h3 class="text-sm font-medium text-gray-900 mb-4">Etkinlik Bilgisi</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Etkinlik</label>
                <select class="wf-v2-input text-sm">
                  <option selected>Masha &amp; Bear Live Show</option>
                  <option>SpongeBob Dance Party</option>
                  <option>Nickelodeon Character Meet</option>
                  <option>Fireworks Show</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Konum</label>
                <select class="wf-v2-input text-sm">
                  <option selected>Theme Park - Legends Arena</option>
                  <option>Theme Park - Nick Central</option>
                  <option>Theme Park - Bikini Bottom</option>
                  <option>Shopping Avenue - Ana Sahne</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Tekrar Kurali -->
          <div class="border-2 border-gray-300 rounded-lg p-5 bg-white">
            <h3 class="text-sm font-medium text-gray-900 mb-4">Tekrar Kurali</h3>

            <div class="mb-4">
              <label class="block text-xs font-medium text-gray-600 mb-1">Tekrar Tipi</label>
              <div class="flex gap-2">
                <button @click="repeatType = 'daily'"
                        :class="repeatType === 'daily' ? 'wf-v2-btn wf-v2-btn-primary' : 'wf-v2-btn'"
                        class="text-sm flex-1">Her Gun</button>
                <button @click="repeatType = 'weekly'"
                        :class="repeatType === 'weekly' ? 'wf-v2-btn wf-v2-btn-primary' : 'wf-v2-btn'"
                        class="text-sm flex-1">Haftalik</button>
                <button @click="repeatType = 'custom'"
                        :class="repeatType === 'custom' ? 'wf-v2-btn wf-v2-btn-primary' : 'wf-v2-btn'"
                        class="text-sm flex-1">Ozel</button>
                <button @click="repeatType = 'once'"
                        :class="repeatType === 'once' ? 'wf-v2-btn wf-v2-btn-primary' : 'wf-v2-btn'"
                        class="text-sm flex-1">Tek Sefer</button>
              </div>
            </div>

            <!-- Haftalik Gun Secimi -->
            <div x-show="repeatType === 'weekly'" class="mb-4">
              <label class="block text-xs font-medium text-gray-600 mb-2">Gunler</label>
              <div class="flex gap-2">
                <template x-for="[key, label] in [['mon','Pzt'],['tue','Sal'],['wed','Car'],['thu','Per'],['fri','Cum'],['sat','Cmt'],['sun','Paz']]" :key="key">
                  <button @click="selectedDays[key] = !selectedDays[key]"
                          :class="selectedDays[key] ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-white text-gray-600 border-gray-300'"
                          class="w-10 h-10 rounded-lg border-2 text-xs font-medium transition-colors"
                          x-text="label">
                  </button>
                </template>
              </div>
            </div>

            <!-- Saat -->
            <div class="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Baslangic Saati</label>
                <input type="time" class="wf-v2-input text-sm" value="10:00">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Bitis Saati</label>
                <input type="time" class="wf-v2-input text-sm" value="11:00">
              </div>
            </div>

            <!-- Tarih Araligi -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Gecerlilik Baslangici</label>
                <input type="date" class="wf-v2-input text-sm" value="2026-02-24">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Gecerlilik Bitisi</label>
                <input type="date" class="wf-v2-input text-sm" value="2026-04-30">
              </div>
            </div>
          </div>

          <!-- Gosterim Ayarlari -->
          <div class="border-2 border-gray-300 rounded-lg p-5 bg-white">
            <h3 class="text-sm font-medium text-gray-900 mb-4">Gosterim Ayarlari</h3>
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <label class="text-sm text-gray-600">Timeline'da Goster</label>
                <label class="wf-toggle">
                  <input type="checkbox" checked class="wf-toggle-input">
                  <div class="wf-toggle-slider"></div>
                </label>
              </div>
              <div class="flex items-center justify-between">
                <label class="text-sm text-gray-600">Promo Banner'da Goster</label>
                <label class="wf-toggle">
                  <input type="checkbox" checked class="wf-toggle-input">
                  <div class="wf-toggle-slider"></div>
                </label>
              </div>
              <div class="flex items-center justify-between">
                <label class="text-sm text-gray-600">Countdown Timer Aktif</label>
                <label class="wf-toggle">
                  <input type="checkbox" class="wf-toggle-input">
                  <div class="wf-toggle-slider"></div>
                </label>
              </div>
            </div>
          </div>

          <!-- Onizleme -->
          <div class="border-2 border-gray-200 rounded-lg p-4 bg-gray-50">
            <h3 class="text-xs font-medium text-gray-500 mb-2">Zamanlama Onizleme</h3>
            <div class="text-sm text-gray-700">
              <strong>Masha &amp; Bear Live Show</strong> her <span class="text-indigo-600 font-medium">Pazartesi, Carsamba, Cuma</span> gunu
              <span class="text-indigo-600 font-medium">10:00 - 11:00</span> arasi
              <span class="text-gray-500">Theme Park - Legends Arena</span> konumunda gosterilecektir.
            </div>
            <div class="text-xs text-gray-400 mt-1">24.02.2026 - 30.04.2026 (toplam ~28 gosterim)</div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../../tool/js/tool-icons.js"></script>
  <script src="../../tool/js/toolbar.js"></script>
  <script src="../../tool/js/comments.js"></script>

</body>
</html>
