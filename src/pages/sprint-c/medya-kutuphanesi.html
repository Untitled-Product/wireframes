<!--
  Wireframe: medya-kutuphanesi
  Task: C-006
  Karar Versiyonu: -
  Son Guncelleme: 2026-02-26

  Medya Kutuphanesi (Media Library)
  - Gorsel ve dosya yonetimi
  - Grid gorunum (4 kolon)
  - Arama + tip filtresi + siralama
  - Yukle modal (drag & drop)
  - Detay modal (onizleme, alt text 4 dil, URL kopyala)
-->
<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medya Kutuphanesi - Legends DXP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .fonts-loading { opacity: 0; }
    .fonts-loaded { opacity: 1; transition: opacity 0.1s ease-in; }
  </style>
  <script>
    document.documentElement.classList.add('fonts-loading');
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      window.addEventListener('load', () => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    }
  </script>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="stylesheet" href="../../wireframe/css/wireframe.css">
  <script src="../../wireframe/js/icons.js"></script>
  <script src="../../wireframe/js/layout-components-v2.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'teal';
    document.documentElement.classList.add('theme-' + theme);
  </script>
</head>
<body class="min-h-screen wireframe-page" x-data="{
  sidebarOpen: true,
  mobileMenu: false,
  uploadModalOpen: false,
  detailModalOpen: false,
  detailLang: 'tr',
  filterType: 'all',
  sortBy: 'newest',
  searchQuery: '',
  selectedMedia: null,
  uploadProgress: 0,
  uploading: false,
  urlCopied: false,
  deleteConfirmOpen: false,
  deleteTarget: null,
  deleteHasUsage: true,
  deleteUsageCount: 3,
  deleteUsageLocations: [
    { page: 'Ana Sayfa', block: 'HeroBanner - Slide 1' },
    { page: 'Kampanya Banneri', block: 'PromoBanner' },
    { page: 'Otel Tanitim', block: 'FeatureBannerSlider - Slide 2' }
  ],
  mediaItems: [
    { id: 1, name: 'hero-banner.jpg', type: 'image', size: '2.4 MB', date: '26.02.2026', resolution: '1920x1080', ext: 'JPG' },
    { id: 2, name: 'logo-legends.svg', type: 'image', size: '48 KB', date: '25.02.2026', resolution: '512x512', ext: 'SVG' },
    { id: 3, name: 'tanitim-video.mp4', type: 'video', size: '8.7 MB', date: '24.02.2026', resolution: '1920x1080', ext: 'MP4' },
    { id: 4, name: 'menu-restoran.pdf', type: 'document', size: '1.2 MB', date: '24.02.2026', resolution: '-', ext: 'PDF' },
    { id: 5, name: 'aqua-park-01.jpg', type: 'image', size: '3.1 MB', date: '23.02.2026', resolution: '2560x1440', ext: 'JPG' },
    { id: 6, name: 'otel-oda-suite.jpg', type: 'image', size: '1.8 MB', date: '23.02.2026', resolution: '1600x900', ext: 'JPG' },
    { id: 7, name: 'kampanya-banner.png', type: 'image', size: '920 KB', date: '22.02.2026', resolution: '1200x630', ext: 'PNG' },
    { id: 8, name: 'etkinlik-takvimi.pdf', type: 'document', size: '540 KB', date: '22.02.2026', resolution: '-', ext: 'PDF' },
    { id: 9, name: 'tema-park-giris.jpg', type: 'image', size: '2.9 MB', date: '21.02.2026', resolution: '1920x1280', ext: 'JPG' },
    { id: 10, name: 'promo-klip.mp4', type: 'video', size: '5.3 MB', date: '21.02.2026', resolution: '1280x720', ext: 'MP4' },
    { id: 11, name: 'icon-set.svg', type: 'image', size: '32 KB', date: '20.02.2026', resolution: '256x256', ext: 'SVG' },
    { id: 12, name: 'slider-bg-02.jpg', type: 'image', size: '4.1 MB', date: '20.02.2026', resolution: '2560x1440', ext: 'JPG' }
  ]
}">

  <div class="flex min-h-screen">
    <!-- Sidebar Component (V2) -->
    <div data-component="sidebar"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Header Component (V2) -->
      <div data-component="header"></div>

      <main class="p-6 flex-1">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-5">
          <div>
            <h1 class="text-xl font-semibold text-gray-900">Medya Kutuphanesi</h1>
            <p class="text-sm text-gray-500 mt-0.5">Gorsel ve dosyalarinizi yonetin</p>
          </div>
          <button @click="uploadModalOpen = true; uploadProgress = 0; uploading = false" class="wf-v2-btn wf-v2-btn-primary inline-flex items-center gap-1.5 text-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Yukle
          </button>
        </div>

        <!-- Search + Filter Bar -->
        <div class="flex items-center gap-3 mb-5">
          <div class="flex-1 max-w-md">
            <div class="wf-v2-search">
              <svg class="wf-v2-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" placeholder="Dosya ara..." class="wf-v2-search-input" x-model="searchQuery">
            </div>
          </div>
          <div class="flex items-center gap-2 ml-auto">
            <select class="wf-v2-input text-sm w-40" x-model="filterType">
              <option value="all">Tumu</option>
              <option value="image">Gorseller</option>
              <option value="video">Videolar</option>
              <option value="document">Dokumanlar</option>
            </select>
            <select class="wf-v2-input text-sm w-36" x-model="sortBy">
              <option value="newest">En yeni</option>
              <option value="oldest">En eski</option>
              <option value="name">Isme gore</option>
            </select>
          </div>
        </div>

        <!-- Media Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
          <template x-for="item in mediaItems.filter(m => filterType === 'all' || m.type === filterType)" :key="item.id">
            <div class="group border-2 border-gray-200 rounded-lg overflow-hidden bg-white hover:border-gray-400 transition-colors cursor-pointer relative"
                 @click="selectedMedia = item; detailModalOpen = true; detailLang = 'tr'; urlCopied = false">
              <!-- Thumbnail -->
              <div class="bg-gray-100 flex items-center justify-center relative overflow-hidden" style="height: 200px">
                <!-- Image placeholder -->
                <template x-if="item.type === 'image'">
                  <div class="flex flex-col items-center gap-2 text-gray-300">
                    <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span class="text-xs" x-text="item.ext"></span>
                  </div>
                </template>
                <!-- Video placeholder -->
                <template x-if="item.type === 'video'">
                  <div class="flex flex-col items-center gap-2 text-gray-300">
                    <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span class="text-xs" x-text="item.ext"></span>
                  </div>
                </template>
                <!-- Document placeholder -->
                <template x-if="item.type === 'document'">
                  <div class="flex flex-col items-center gap-2 text-gray-300">
                    <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span class="text-xs" x-text="item.ext"></span>
                  </div>
                </template>

                <!-- Hover Overlay -->
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                  <button @click.stop="deleteTarget = item; deleteConfirmOpen = true" class="wf-v2-btn wf-v2-btn-sm bg-white text-red-600 border-white hover:bg-red-50 text-xs px-3 py-1.5" style="position: relative; z-index: 10;">
                    Sil
                  </button>
                </div>

                <!-- Type badge -->
                <span class="absolute top-2 right-2 font-medium px-1.5 py-0.5 rounded bg-white/80 text-gray-600" style="font-size: 10px" x-text="item.ext"></span>
              </div>

              <!-- File Info -->
              <div class="p-3">
                <p class="text-sm font-medium text-gray-900 truncate" x-text="item.name"></p>
                <div class="flex items-center justify-between mt-1">
                  <span class="text-xs text-gray-400" x-text="item.size"></span>
                  <span class="text-xs text-gray-400" x-text="item.date"></span>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Stats -->
        <div class="mt-4 text-sm text-gray-400">
          12 dosya goruntuluyor (9 gorsel, 2 video, 1 dokuman)
        </div>

      </main>
    </div>
  </div>

  <!-- ====== MODAL: Dosya Yukle ====== -->
  <div x-show="uploadModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
    <div class="fixed inset-0 bg-black/30" @click="uploadModalOpen = false"></div>
    <div class="wf-v2-modal relative z-10 w-full max-w-lg">
      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-semibold text-gray-900">Dosya Yukle</h3>
        <button @click="uploadModalOpen = false" class="p-1 rounded hover:bg-gray-100 text-gray-400">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Drag & Drop Zone -->
      <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-gray-400 transition-colors cursor-pointer"
           :class="uploading ? 'bg-gray-50 pointer-events-none' : 'bg-white'">
        <template x-if="!uploading">
          <div>
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p class="text-sm text-gray-600 mb-1">Dosyalari buraya surukleyin</p>
            <p class="text-sm text-gray-400">
              veya <button @click="uploading = true; uploadProgress = 0; let interval = setInterval(() => { uploadProgress += 10; if(uploadProgress >= 100) { clearInterval(interval); setTimeout(() => { uploading = false; uploadModalOpen = false; }, 800); } }, 300)" class="text-indigo-600 hover:text-indigo-800 font-medium underline">dosya secin</button>
            </p>
          </div>
        </template>

        <!-- Upload Progress -->
        <template x-if="uploading">
          <div>
            <svg class="w-10 h-10 mx-auto mb-3 text-indigo-500 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <p class="text-sm text-gray-600 mb-3">Yukleniyor...</p>
            <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
              <div class="bg-indigo-500 h-2 rounded-full transition-all duration-300" :style="'width: ' + uploadProgress + '%'"></div>
            </div>
            <p class="text-xs text-gray-400">%<span x-text="uploadProgress"></span> tamamlandi</p>
          </div>
        </template>
      </div>

      <!-- Accepted Formats -->
      <div class="mt-4 flex items-center gap-2 text-xs text-gray-400">
        <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>Kabul edilen formatlar: JPG, PNG, SVG, MP4, PDF (maks. 10MB)</span>
      </div>

      <!-- Modal Footer -->
      <div class="flex gap-3 justify-end mt-6">
        <button @click="uploadModalOpen = false" class="wf-v2-btn">Vazgec</button>
      </div>
    </div>
  </div>

  <!-- ====== MODAL: Medya Detay ====== -->
  <div x-show="detailModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
    <div class="fixed inset-0 bg-black/30" @click="detailModalOpen = false"></div>
    <div class="wf-v2-modal relative z-10 w-full max-w-lg overflow-y-auto" style="max-height: 90vh">
      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-semibold text-gray-900">Medya Detayi</h3>
        <button @click="detailModalOpen = false" class="p-1 rounded hover:bg-gray-100 text-gray-400">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-4">
        <!-- Preview -->
        <div class="bg-gray-100 rounded-lg border-2 border-gray-200 flex items-center justify-center" style="height: 200px">
          <template x-if="selectedMedia && selectedMedia.type === 'image'">
            <div class="flex flex-col items-center gap-2 text-gray-300">
              <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span class="text-xs text-gray-400">Gorsel Onizleme</span>
            </div>
          </template>
          <template x-if="selectedMedia && selectedMedia.type === 'video'">
            <div class="flex flex-col items-center gap-2 text-gray-300">
              <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span class="text-xs text-gray-400">Video Onizleme</span>
            </div>
          </template>
          <template x-if="selectedMedia && selectedMedia.type === 'document'">
            <div class="flex flex-col items-center gap-2 text-gray-300">
              <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              <span class="text-xs text-gray-400">Dokuman Onizleme</span>
            </div>
          </template>
        </div>

        <!-- File Info -->
        <div class="grid grid-cols-3 gap-3">
          <div>
            <p class="text-xs text-gray-500 mb-0.5">Dosya Adi</p>
            <p class="text-sm font-medium text-gray-900" x-text="selectedMedia?.name || '-'"></p>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-0.5">Boyut</p>
            <p class="text-sm font-medium text-gray-900" x-text="selectedMedia?.size || '-'"></p>
          </div>
          <div>
            <p class="text-xs text-gray-500 mb-0.5">Cozunurluk</p>
            <p class="text-sm font-medium text-gray-900" x-text="selectedMedia?.resolution || '-'"></p>
          </div>
        </div>

        <!-- URL Copy -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Dosya URL</label>
          <div class="flex gap-2">
            <input type="text" class="wf-v2-input text-sm flex-1" :value="'https://cdn.legends.com/media/' + (selectedMedia?.name || '')" readonly>
            <button @click="urlCopied = true; setTimeout(() => urlCopied = false, 2000)" class="wf-v2-btn wf-v2-btn-sm inline-flex items-center gap-1 text-xs px-3 flex-shrink-0">
              <template x-if="!urlCopied">
                <span class="inline-flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  Kopyala
                </span>
              </template>
              <template x-if="urlCopied">
                <span class="inline-flex items-center gap-1 text-green-600">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                  Kopyalandi
                </span>
              </template>
            </button>
          </div>
        </div>

        <!-- Alt Text with Language Tabs -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Alt Metin (Alt Text)</label>
          <div class="flex border-2 border-gray-300 rounded-lg overflow-hidden mb-2">
            <template x-for="lang in ['tr', 'en', 'de', 'ru']" :key="lang">
              <button @click="detailLang = lang"
                      :class="detailLang === lang ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-500 hover:bg-gray-50'"
                      class="flex-1 py-2 text-xs text-center uppercase transition-colors relative">
                <span x-text="lang"></span>
                <template x-if="lang !== 'tr'">
                  <span class="absolute top-1 right-1 w-1.5 h-1.5 bg-orange-400 rounded-full"></span>
                </template>
              </button>
            </template>
          </div>
          <input type="text" class="wf-v2-input text-sm" x-show="detailLang === 'tr'" placeholder="Gorsel icin alt metin giriniz..." value="Legends tema park giris gorseli">
          <input type="text" class="wf-v2-input text-sm" x-show="detailLang === 'en'" placeholder="Enter alt text for this image..." style="display:none">
          <input type="text" class="wf-v2-input text-sm" x-show="detailLang === 'de'" placeholder="Alt-Text eingeben..." style="display:none">
          <input type="text" class="wf-v2-input text-sm" x-show="detailLang === 'ru'" placeholder="Alt metin giriniz..." style="display:none">
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-200">
        <button @click="deleteConfirmOpen = true" class="wf-v2-btn inline-flex items-center gap-1.5 text-sm text-red-600 border-red-200 hover:bg-red-50 hover:border-red-300">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"/></svg>
          Sil
        </button>
        <div class="flex gap-3">
          <button @click="detailModalOpen = false" class="wf-v2-btn">Vazgec</button>
          <button @click="detailModalOpen = false" class="wf-v2-btn wf-v2-btn-primary">Kaydet</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== MODAL: Silme Onay (Kullanim Uyarili) ====== -->
  <div x-show="deleteConfirmOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
    <div class="fixed inset-0 bg-black/30" @click="deleteConfirmOpen = false"></div>
    <div class="wf-v2-modal relative z-10 w-full max-w-md">
      <div class="text-center">
        <svg class="w-10 h-10 mx-auto mb-3 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h3 class="text-base font-semibold text-gray-900 mb-1">Silmek istediginize emin misiniz?</h3>
      </div>

      <!-- Kullanim Uyarisi -->
      <template x-if="deleteHasUsage">
        <div class="mt-4 border-2 border-orange-200 bg-orange-50 rounded-lg p-3">
          <div class="flex items-start gap-2">
            <svg class="w-5 h-5 text-orange-500 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/></svg>
            <div>
              <p class="text-sm font-medium text-orange-800">Bu dosya <span x-text="deleteUsageCount"></span> icerik blogunda kullaniliyor</p>
              <ul class="mt-2 space-y-1">
                <template x-for="loc in deleteUsageLocations" :key="loc.page + loc.block">
                  <li class="text-xs text-orange-700 flex items-center gap-1.5">
                    <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                    <span><strong x-text="loc.page"></strong> &rarr; <span x-text="loc.block"></span></span>
                  </li>
                </template>
              </ul>
              <p class="text-xs text-orange-600 mt-2">Silme sonrasi bu alanlarda placeholder gorsel gosterilecektir.</p>
            </div>
          </div>
        </div>
      </template>

      <!-- Kullanim yoksa basit mesaj -->
      <template x-if="!deleteHasUsage">
        <p class="text-sm text-gray-500 mt-2 text-center">Bu dosya hicbir icerikle iliskilendirilmemis. Guvenle silinebilir.</p>
      </template>

      <div class="flex gap-3 justify-center mt-5">
        <button @click="deleteConfirmOpen = false" class="wf-v2-btn">Vazgec</button>
        <button @click="deleteConfirmOpen = false; deleteTarget = null" class="wf-v2-btn bg-red-600 text-white border-red-600 hover:bg-red-700">Yine de Sil</button>
      </div>
    </div>
  </div>

  <!-- Floating Toolbar & Comments -->
  <script src="../../tool/js/tool-icons.js"></script>
  <script src="../../tool/js/toolbar.js"></script>
  <script src="../../tool/js/comments.js"></script>

</body>
</html>
