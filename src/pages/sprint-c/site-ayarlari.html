<!--
  Wireframe: site-ayarlari (V2)
  Task: C-004
  Karar Versiyonu: -
  Son Guncelleme: 2026-02-26

  Site Ayarlari - Sosyal medya, iletisim, app link, newsletter
  - Bolum bazli duzen (accordion/card)
  - Her bolum kaydedilebilir
-->
<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Ayarlari - Legends DXP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .fonts-loading { opacity: 0; }
    .fonts-loaded { opacity: 1; transition: opacity 0.1s ease-in; }
  </style>
  <script>
    document.documentElement.classList.add('fonts-loading');
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      window.addEventListener('load', () => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    }
  </script>
  <link rel="stylesheet" href="../../../dist/output.css">
  <link rel="stylesheet" href="../../wireframe/css/wireframe.css">
  <script src="../../wireframe/js/icons.js"></script>
  <script src="../../wireframe/js/layout-components-v2.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'teal';
    document.documentElement.classList.add('theme-' + theme);
  </script>
</head>
<body class="min-h-screen wireframe-page" x-data="{
  sidebarOpen: true,
  mobileMenu: false,
  sections: {
    contact: true,
    social: true,
    app: true,
    newsletter: false,
    weather: false
  }
}">

  <div class="flex min-h-screen">
    <div data-component="sidebar"></div>
    <div class="flex-1 flex flex-col min-w-0">
      <div data-component="header"></div>

      <main class="p-6 flex-1">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-xl font-semibold text-gray-900">Site Ayarlari</h1>
            <p class="text-sm text-gray-500 mt-0.5">Genel site yapilandirmalarini yonetin</p>
          </div>
          <button class="wf-v2-btn wf-v2-btn-primary inline-flex items-center gap-1.5 text-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Tumu Kaydet
          </button>
        </div>

        <div class="max-w-3xl space-y-4">

          <!-- Iletisim Bilgileri -->
          <div class="border border-gray-200 rounded-lg bg-white shadow-sm">
            <button @click="sections.contact = !sections.contact" class="w-full px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/></svg>
                <span class="text-sm font-medium text-gray-900">Iletisim Bilgileri</span>
              </div>
              <svg class="w-4 h-4 text-gray-400 transition-transform" :class="sections.contact ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div x-show="sections.contact" class="px-6 pb-6 space-y-5 border-t border-gray-100 pt-5">
              <div class="grid grid-cols-2 gap-5">
                <div>
                  <label class="block text-xs font-medium text-gray-600 mb-1.5">Telefon</label>
                  <input type="text" class="wf-v2-input text-sm" value="+90 242 310 00 00">
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 mb-1.5">E-posta</label>
                  <input type="email" class="wf-v2-input text-sm" value="info@landoflegends.com">
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Adres</label>
                <textarea class="wf-v2-input text-sm" rows="2">Kadriye Mahallesi Ataturk Caddesi No:1, 07506 Serik/Antalya</textarea>
              </div>
              <div class="grid grid-cols-2 gap-5">
                <div>
                  <label class="block text-xs font-medium text-gray-600 mb-1.5">Google Maps Embed URL</label>
                  <input type="text" class="wf-v2-input text-sm" value="https://maps.google.com/...">
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 mb-1.5">Google Maps Koordinatlari</label>
                  <input type="text" class="wf-v2-input text-sm" value="36.8523, 31.1342">
                </div>
              </div>
            </div>
          </div>

          <!-- Sosyal Medya -->
          <div class="border border-gray-200 rounded-lg bg-white shadow-sm">
            <button @click="sections.social = !sections.social" class="w-full px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                <span class="text-sm font-medium text-gray-900">Sosyal Medya Linkleri</span>
              </div>
              <svg class="w-4 h-4 text-gray-400 transition-transform" :class="sections.social ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div x-show="sections.social" class="px-6 pb-6 space-y-4 border-t border-gray-100 pt-5">
              <div class="flex items-center gap-3">
                <span class="w-20 text-xs text-gray-500">Facebook</span>
                <input type="url" class="wf-v2-input text-sm flex-1" value="https://facebook.com/landoflegends">
              </div>
              <div class="flex items-center gap-3">
                <span class="w-20 text-xs text-gray-500">Instagram</span>
                <input type="url" class="wf-v2-input text-sm flex-1" value="https://instagram.com/landoflegends">
              </div>
              <div class="flex items-center gap-3">
                <span class="w-20 text-xs text-gray-500">YouTube</span>
                <input type="url" class="wf-v2-input text-sm flex-1" value="https://youtube.com/landoflegends">
              </div>
              <div class="flex items-center gap-3">
                <span class="w-20 text-xs text-gray-500">X (Twitter)</span>
                <input type="url" class="wf-v2-input text-sm flex-1" value="https://x.com/landoflegends">
              </div>
              <div class="flex items-center gap-3">
                <span class="w-20 text-xs text-gray-500">TikTok</span>
                <input type="url" class="wf-v2-input text-sm flex-1" value="https://tiktok.com/@landoflegends">
              </div>
              <button class="text-xs text-indigo-600 hover:text-indigo-800">+ Platform Ekle</button>
            </div>
          </div>

          <!-- App Linkleri -->
          <div class="border border-gray-200 rounded-lg bg-white shadow-sm">
            <button @click="sections.app = !sections.app" class="w-full px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                <span class="text-sm font-medium text-gray-900">Mobil Uygulama Linkleri</span>
              </div>
              <svg class="w-4 h-4 text-gray-400 transition-transform" :class="sections.app ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div x-show="sections.app" class="px-6 pb-6 space-y-4 border-t border-gray-100 pt-5">
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">App Store URL (iOS)</label>
                <input type="url" class="wf-v2-input text-sm" value="https://apps.apple.com/app/land-of-legends/id123456">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Google Play URL (Android)</label>
                <input type="url" class="wf-v2-input text-sm" value="https://play.google.com/store/apps/details?id=com.landoflegends">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">App Gallery URL (Huawei)</label>
                <input type="url" class="wf-v2-input text-sm" placeholder="Opsiyonel">
              </div>
            </div>
          </div>

          <!-- Newsletter -->
          <div class="border border-gray-200 rounded-lg bg-white shadow-sm">
            <button @click="sections.newsletter = !sections.newsletter" class="w-full px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <span class="text-sm font-medium text-gray-900">Newsletter Ayarlari</span>
              </div>
              <svg class="w-4 h-4 text-gray-400 transition-transform" :class="sections.newsletter ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div x-show="sections.newsletter" style="display: none;" class="px-6 pb-6 space-y-4 border-t border-gray-100 pt-5">
              <!-- 4 Dil Tab -->
              <div class="flex border border-gray-200 rounded-lg overflow-hidden">
                <button class="flex-1 py-2 text-xs text-center uppercase bg-indigo-50 text-indigo-700 font-medium">TR</button>
                <button class="flex-1 py-2 text-xs text-center uppercase text-gray-500">EN</button>
                <button class="flex-1 py-2 text-xs text-center uppercase text-gray-500">DE</button>
                <button class="flex-1 py-2 text-xs text-center uppercase text-gray-500">RU</button>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Baslik</label>
                <input type="text" class="wf-v2-input text-sm" value="Kampanyalardan haberdar olun!">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Aciklama</label>
                <input type="text" class="wf-v2-input text-sm" value="E-posta adresinizi girin ve firsatlari kacirmayin.">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Buton Metni</label>
                <input type="text" class="wf-v2-input text-sm" value="Abone Ol">
              </div>
              <div class="flex items-center justify-between">
                <label class="text-xs font-medium text-gray-600">KVKK Onay Metni Goster</label>
                <label class="wf-toggle">
                  <input type="checkbox" checked class="wf-toggle-input">
                  <div class="wf-toggle-slider"></div>
                </label>
              </div>
            </div>
          </div>

          <!-- Hava Durumu -->
          <div class="border border-gray-200 rounded-lg bg-white shadow-sm">
            <button @click="sections.weather = !sections.weather" class="w-full px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
                <span class="text-sm font-medium text-gray-900">Hava Durumu Widget</span>
              </div>
              <svg class="w-4 h-4 text-gray-400 transition-transform" :class="sections.weather ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div x-show="sections.weather" style="display: none;" class="px-6 pb-6 space-y-4 border-t border-gray-100 pt-5">
              <div class="flex items-center justify-between">
                <label class="text-xs font-medium text-gray-600">Widget Aktif</label>
                <label class="wf-toggle">
                  <input type="checkbox" checked class="wf-toggle-input">
                  <div class="wf-toggle-slider"></div>
                </label>
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">API Key</label>
                <input type="text" class="wf-v2-input text-sm" value="••••••••••••••••">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-600 mb-1.5">Konum</label>
                <input type="text" class="wf-v2-input text-sm" value="Serik, Antalya">
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../../tool/js/tool-icons.js"></script>
  <script src="../../tool/js/toolbar.js"></script>
  <script src="../../tool/js/comments.js"></script>

</body>
</html>
